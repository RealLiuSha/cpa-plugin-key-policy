# Example CLIProxyAPI snippet for cpa-key-policy 1.0.
# Replace placeholders. Never commit real keys or production paths.

plugins:
  enabled: true
  dir: "plugins"
  configs:
    cpa-key-policy:
      enabled: true
      priority: 10
      # State and usage are a paired dataset. The lists below seed first boot;
      # after state exists, keys and models come only from state.
      state_file: "cpa-key-policy-state.json"
      usage_timezone: "Asia/Shanghai"

      # A public model routes to one CPA capability. Prices are USD; omitted
      # prices are $0. billing_multiplier scales token charges (default 1).
      models:
        - name: "fast"
          provider: "codex"
          target_model: "gpt-5.6"
          billing_mode: "tokens"
          billing_multiplier: 1.2
          input_price_per_million: 1
          output_price_per_million: 2
          cache_read_price_per_million: 0.1
          cache_write_price_per_million: 0.3

        - name: "grok-imagine-image"
          provider: "xai"
          target_model: "grok-imagine-image"
          billing_mode: "per_call"
          per_call_usd: 0.07

      # Seed keys are used only when state_file does not exist. Afterwards,
      # create and edit keys through the Web UI or management API.
      keys:
        - id: "team-a"
          name: "Team A"
          enabled: true
          key_hash: "sha256:replace-with-hash"
          key_preview: "cpa_abc...xyz"
          rpm: 60
          daily_limit_usd: 10
          weekly_limit_usd: 50
          monthly_limit_usd: 150
          models:
            - name: "fast"
              daily_limit_usd: 5
            - name: "grok-imagine-image"
