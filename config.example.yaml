# Example CLIProxyAPI snippet for cpa-key-policy v0.6.
# Replace placeholders. Never commit real keys or production paths.

plugins:
  enabled: true
  dir: "plugins"
  configs:
    cpa-key-policy:
      enabled: true
      priority: 10
      # State and usage are a paired dataset. The lists below seed first boot;
      # after state exists, managed keys/models/rules come only from state.
      state_file: "cpa-key-policy-state.json"
      usage_timezone: "Asia/Shanghai"

      models:
        - name: "fast"
          targets:
            - provider: "codex"
              target_model: "gpt-5.6"
              group: "team"
            - provider: "openai"
              target_model: "gpt-5.6"
          dispatch: "round-robin"
          billing_mode: "tokens"
          free: false
          input_price_per_million: 1
          output_price_per_million: 2
          cache_read_price_per_million: 0.1
          cache_write_price_per_million: 0.3

        - name: "community"
          targets:
            - provider: "codex"
              target_model: "community-model"
              group: "free"
          dispatch: "priority"
          billing_mode: "tokens"
          free: true

      # Seed keys are used only when state_file does not exist. Afterwards,
      # create and edit keys through the Web UI or management API.
      keys:
        - id: "team-a"
          name: "Team A"
          enabled: true
          key_hash: "sha256:replace-with-hash"
          key_preview: "cpa_abc...xyz"
          rpm: 60
          daily_limit_usd: 10
          weekly_limit_usd: 50
          monthly_limit_usd: 150
          models:
            - name: "fast"
              daily_limit_usd: 5
            - name: "community"

      classify_rules:
        - name: "team"
          field: "plan_type"
          pattern: "^team$"
          group: "team"
          enabled: true
