# Example CLIProxyAPI snippet for cpa-key-policy (data format 7).
# Replace placeholders. Never commit real keys or production paths.

plugins:
  enabled: true
  dir: "plugins"
  configs:
    cpa-key-policy:
      enabled: true
      priority: 10
      # State, usage and history are one dataset. The lists below seed the
      # first boot; after state exists, keys and prices come only from state.
      state_file: "cpa-key-policy-state.json"
      usage_timezone: "Asia/Shanghai"

      # The plugin's own settings, both optional. search_enabled registers a
      # model router for Codex alpha search (routing is set on the Search
      # page). cpa_config_path is CPA's config.yaml, relative to CPA's working
      # directory; balance queries and detection read the config's API keys
      # from it. Releases 0.16.0 and earlier reject both keys.
      # search_enabled: false
      # cpa_config_path: "config.yaml"

      # A price row prices one upstream model id (the Model CPA reports in
      # usage records). provider is an optional qualifier; an empty provider
      # matches any provider. Prices are USD per million tokens; omitted
      # prices are $0 and the row is reported as unpriced until set.
      # billing_multiplier scales token charges (1..50, default 1).
      models:
        - name: "gpt-5.6"
          provider: "codex"
          billing_mode: "tokens"
          billing_multiplier: 1.2
          input_price_per_million: 1
          output_price_per_million: 2
          cache_read_price_per_million: 0.1
          cache_write_price_per_million: 0.3

        # Per-call rows bill once per admitted POST on an image or video
        # generation endpoint. Result polling and the image record a Codex
        # image_generation tool call on /v1/responses adds are not billed
        # per call (unmetered_per_call); price models that report tokens,
        # such as Codex's gpt-image-*, by token instead.
        - name: "grok-imagine-image"
          provider: "xai"
          billing_mode: "per_call"
          per_call_usd: 0.07

      # Seed keys are used only when state_file does not exist. Afterwards,
      # create and edit keys through the Web UI or management API. Every
      # enabled key may use every model; limits of 0 mean unlimited.
      keys:
        - id: "team-a"
          name: "Team A"
          enabled: true
          key_hash: "sha256:replace-with-hash"
          key_preview: "cpa_abc...xyz"
          rpm: 60
          daily_limit_usd: 10
          weekly_limit_usd: 50
          monthly_limit_usd: 150
